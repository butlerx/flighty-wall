min_version = "2026.9.12"

[tools]
"pipx:mitmproxy" = "12.2"
prek             = "0.4"
tombi            = "1.2"
uv               = "0.12"
zizmor           = "latest"

[settings]
experimental = true
lockfile     = true

[tasks.sync]
description = "Create the virtualenv and install every dependency group"
quiet       = true
sources     = ["pyproject.toml", "uv.lock", ".python-version"]
outputs     = [".venv/pyvenv.cfg"]
run         = "uv sync --frozen"

[tasks.hooks]
description = "Install the git hooks that CI also runs"
quiet       = true
run         = "prek install --hook-type pre-commit --hook-type commit-msg"

[tasks.lint]
description = "ruff, mypy, pyright, tombi, yamlfmt, actionlint, zizmor"
depends     = ["sync"]
quiet       = true
run         = "prek run --all-files"

[tasks."lint:fix"]
description = "Auto-fix what the hooks can fix"
depends     = ["sync"]
quiet       = true
run         = "prek run --all-files ruff-check ruff-format tombi-format yamlfmt || true"

[tasks.test]
description = "Run the test suite with coverage"
alias       = "t"
depends     = ["sync"]
quiet       = true
run         = "uv run --frozen pytest --cov"

[tasks.deps]
description = "Check for missing, unused, or misplaced dependencies"
depends     = ["sync"]
quiet       = true
run         = "uv run --frozen deptry src"

[tasks.check]
description = "Everything CI runs: lint, types, tests, deps"
depends     = ["lint", "test", "deps"]
quiet       = true

# `mise run fixture:calendar -- --redact-term "Friend Name"`
[tasks."fixture:calendar"]
description = "Capture a sanitized Google Calendar fixture into tests/fixtures"
depends     = ["sync"]
quiet       = true
run         = "uv run --frozen flighty-wall inspect-calendar --config config.toml --output tests/fixtures/google_calendar/friend-flight.json --lookahead-days 60 --lookback-days 3"

[tasks."ci:lint"]
depends = ["lint", "deps"]
hide    = true
quiet   = true

[tasks."ci:test"]
depends = ["test"]
hide    = true
quiet   = true

[tasks."capture:sanitize"]
description = "Turn captures/flightwall.har into sanitized fixtures under tests/fixtures/flightwall"
depends     = ["sync"]
quiet       = true
run         = "uv run --frozen flighty-wall sanitize-capture --input captures/flightwall.har --output-dir tests/fixtures/flightwall"
