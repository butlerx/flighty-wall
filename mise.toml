min_version = "2026.9.12"

[tools]
"pipx:mitmproxy" = "12.2"
prek             = "0.4"
rust             = "stable"
tombi            = "1.2"
zizmor           = "latest"

# Only the SQLite driver: the default build also compiles Postgres and MySQL support.
[tools."cargo:sqlx-cli"]
version          = "0.8.6"
default-features = false
features         = "sqlite,rustls"

[settings]
experimental = true
lockfile     = true

[tasks.hooks]
description = "Install the git hooks that CI also runs"
quiet       = true
run         = "prek install --hook-type pre-commit --hook-type commit-msg"

[tasks.lint]
description = "prek: rustfmt, clippy, tombi, yamlfmt, actionlint, zizmor"
quiet       = true
run         = "prek run --all-files"

[tasks."lint:fix"]
description = "Auto-fix what the hooks can fix"
quiet       = true
run         = "prek run --all-files rustfmt tombi-format yamlfmt || true"

[tasks.check]
description = "Everything CI runs: lint, clippy, tests, sqlx cache"
depends     = ["lint", "cargo:check"]
quiet       = true

# `mise run fixture:calendar -- --redact-term "Friend Name"`
[tasks."fixture:calendar"]
description = "Capture a sanitized Google Calendar fixture into tests/fixtures"
quiet       = true
run         = "cargo run --quiet -- inspect-calendar --config config.toml --output tests/fixtures/google_calendar/friend-flight.json --lookahead-days 60 --lookback-days 3"

[tasks."ci:lint"]
depends = ["lint", "cargo:clippy", "sqlx:check"]
hide    = true
quiet   = true

[tasks."ci:test"]
depends = ["cargo:test"]
hide    = true
quiet   = true

[tasks."capture:sanitize"]
description = "Turn captures/flightwall.har into sanitized fixtures under tests/fixtures/flightwall"
quiet       = true
run         = "cargo run --quiet -- sanitize-capture --input captures/flightwall.har --output-dir tests/fixtures/flightwall"

[tasks."cargo:fmt"]
description = "rustfmt, check only"
quiet       = true
run         = "cargo fmt --check"

[tasks."cargo:clippy"]
description = "clippy, pedantic, every target, warnings are errors"
quiet       = true
run         = "cargo clippy --all-targets -- -D warnings"

[tasks."cargo:test"]
description = "Unit tests inline in src/, e2e tests of the binary in tests/"
quiet       = true
run         = "cargo test"

[tasks."cargo:check"]
description = "fmt, clippy, tests, and the committed sqlx query cache"
depends     = ["cargo:fmt", "cargo:clippy", "cargo:test", "sqlx:check"]
quiet       = true
