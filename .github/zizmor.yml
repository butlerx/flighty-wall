# zizmor audit policy for .github/workflows. Rule-level exemptions live here
# rather than as inline `# zizmor: ignore[...]` comments so one file shows
# every accepted risk.
rules:
  cache-poisoning:
    # mise-action's cache is keyed by mise.lock and only feeds tool binaries
    # into lint/test jobs. Nothing here publishes an artifact or release, so a
    # poisoned cache cannot reach a consumer.
    ignore:
      - ci.yml
