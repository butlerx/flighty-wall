# yamlfmt picks up ~/.yamlfmt.yaml when a repo has no config, so CI (which has
# no home config) formatted differently to a local run. Pin the settings here.
formatter:
  type: basic
  eof_newline: true
  force_array_style: block
  retain_line_breaks_single: true
  scan_folded_as_literal: true
  trim_trailing_whitespace: true
