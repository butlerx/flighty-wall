# Same line length as ruff (pyproject.toml [tool.ruff] line-length) so YAML
# and Python wrap at the same column. Formatting is yamlfmt's job; yamllint
# only reports what a formatter cannot fix.
extends: default

rules:
  line-length:
    max: 110
  # yamlfmt writes `key: value` with no space before the colon and one after.
  colons: enable
  # GitHub Actions uses `on:`; the truthy rule would flag it.
  truthy:
    check-keys: false
  # Allow `- item` directly under a key (yamlfmt's block style) and 2-space
  # nested sequences.
  indentation:
    spaces: 2
    indent-sequences: true
  document-start: disable
  comments:
    min-spaces-from-content: 1
