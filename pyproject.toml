[project]
name            = "flighty-wall"
version         = "0.1.0"
description     = "Sync Flighty Friends flights to a FlightWall Mini"
readme          = "README.md"
requires-python = ">=3.11"
license         = "Apache-2.0"
license-files   = ["LICENSE", "NOTICE"]
authors         = [{ name = "Cian Butler", email = "butlerx@notthe.cloud" }]
keywords        = ["daemon", "flightwall", "flighty", "google-calendar"]
classifiers     = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies    = [
  "click>=8.1,<9",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/butlerx/flighty-wall"
Issues   = "https://github.com/butlerx/flighty-wall/issues"

[project.scripts]
flighty-wall = "flighty_wall.cli:cli"

[dependency-groups]
dev    = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
lint   = ["ruff>=0.16.1"]
test   = [
  "deptry>=0.24.0",
  "pytest>=8.3,<9",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "pytest-xdist",
]
typing = [
  "mypy>=1.18.0",
  "pyright>=1.1.400,<2",
]

[build-system]
# PEP 639 `license` / `license-files` need setuptools 77 or newer.
requires      = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
branch = true
omit   = ["*/__main__.py"]

[tool.coverage.report]
fail_under   = 80
exclude_also = [
  # Don't complain about imported type defs
  "if TYPE_CHECKING",
]

[tool.deptry.per_rule_ignores]
# auth.py loads googleapiclient.discovery through importlib so the Google client
# stays behind a typed Protocol; static scanning cannot see that import.
DEP002 = ["google-api-python-client"]

[tool.mypy]
plugins                     = ["pydantic.mypy"]
python_version              = "3.11"
mypy_path                   = "src"
check_untyped_defs          = true
disallow_untyped_decorators = false
exclude                     = ["dist/"]
extra_checks                = true
strict                      = true
strict_equality             = true
strict_optional             = true
warn_redundant_casts        = true
warn_return_any             = true
warn_unused_configs         = true
warn_unused_ignores         = true

[[tool.mypy.overrides]]
module                 = ["google.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion    = "3.11"
venvPath         = "."
venv             = ".venv"
typeCheckingMode = "strict"
include          = ["src", "tests"]

[tool.pytest.ini_options]
addopts   = "-q -n auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length    = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",       # Dynamically typed expressions (typing.Any) are disallowed
  "ARG001",       # Unused function argument
  "COM812",
  "CPY001",       # Missing copyright notice - this project ships no file headers
  "D107",         # Missing docstring in __init__
  "D203",         # 1 blank line required before class docstring
  "D205",         # 1 blank line required between summary line and description
  "D212",         # Multi-line docstring summary should start at the first line
  "EM101",        # Exception must not use a string literal - acceptable for CLI errors
  "EM102",        # Exception must not use an f-string literal - acceptable for CLI errors
  "FBT001",       # Boolean positional argument in function definition
  "FIX002",       # Line contains TODO, consider resolving or converting to issue
  "S603",         # subprocess call: check for execution of untrusted input - trusted internal use
  "TD003",        # Missing issue link on TODO comment
  "TRY003",       # Avoid specifying long messages outside exception class - acceptable for CLI
  "TRY300",       # Consider moving statement(s) out of the try block
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "ARG002",             # Unused method argument
  "ARG005",             # Unused lambda argument
  "D100",               # Missing docstring in public module
  "D101",               # Missing docstring in public class
  "D102",               # Missing docstring in public method
  "D103",               # Missing docstring in public function
  "D104",               # Missing docstring in public package
  "FBT003",             # Boolean positional argument in function call
  "PLR2004",            # Magic value used in comparison - acceptable in test assertions
  "S101",               # Use of assert detected
  "S105",               # Possible hardcoded password in string literal
  "S106",               # Possible hardcoded password in argument
  "SLF001",             # Private member accessed
  "TRY301",             # Abstract raise to an inner function
  "INP001",             # Tests are collected by path, not imported as a package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-returns = 10
max-args    = 8

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates annotations at runtime, so annotation-only imports on its
# models must stay at runtime, not move into TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json".msg        = "Use orjson instead of json"
"import json".msg = "Use orjson instead of json"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups   = ["dev"]
keyring-provider = "subprocess"
