[package]
name         = "flighty-wall"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "Sync Flighty Friends flights to a FlightWall Mini"
license      = "Apache-2.0"
authors      = ["Cian Butler <butlerx@notthe.cloud>"]
readme       = "README.md"
repository   = "https://github.com/butlerx/flighty-wall"
keywords     = ["daemon", "flightwall", "flighty", "google-calendar"]
categories   = ["command-line-utilities"]
# Dev tooling that a `cargo install` never needs.
exclude      = [
  "/.github",
  "/.mise",
  "/.pre-commit-config.yaml",
  "/.yamlfmt.yaml",
  "/.yamllint.yaml",
  "/docs",
  "/mise.lock",
  "/tombi.toml"
]

[lib]
name = "flighty_wall"
path = "src/lib.rs"

[dependencies]
clap                = { version = "4", features = ["derive"] }
hex                 = "0.4"
jsonwebtoken        = "10"
log                 = "0.4"
regex               = "1"
rustix              = { version = "1.1", features = ["fs"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
serde_path_to_error = "0.1"
sha2                = "0.11"
signal-hook         = "0.3"
tempfile            = "3"
thiserror           = "2"
toml                = "1.1"
ureq                = "3"

[dependencies.chrono]
version          = "0.4"
default-features = false
features         = ["clock", "serde", "std"]

[dependencies.env_logger]
version          = "0.11"
default-features = false
features         = ["humantime"]

[dependencies.sqlx]
version          = "0.8"
default-features = false
features         = ["macros", "migrate", "runtime-tokio", "sqlite"]

[dependencies.tokio]
version          = "1"
default-features = false
features         = ["rt", "time"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
# `deny`, not `forbid`: the config tests need one `#[allow]` to set `$HOME`.
unsafe_code = "deny"
